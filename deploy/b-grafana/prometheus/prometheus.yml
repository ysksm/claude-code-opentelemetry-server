global:
  scrape_interval: 30s
  evaluation_interval: 30s

# OTLP で受けたメトリクスの扱い（--web.enable-otlp-receiver と組み合わせる）
otlp:
  # OTEL_RESOURCE_ATTRIBUTES で足した属性をラベルにする。必要なキーを足す。
  promote_resource_attributes:
    - service.name
    - department
    - team.id
    - cost_center
    - enduser.id

storage:
  tsdb:
    # 端末ごとに送信時刻がずれるため、少し古いサンプルも受け付ける
    out_of_order_time_window: 30m

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: otel-collector
    static_configs:
      - targets: ["collector:8888"]
