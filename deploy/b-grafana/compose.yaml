# 案 B：Collector → Prometheus（metrics）＋ Loki（events）→ Grafana
name: claude-otel-grafana

services:
  caddy:
    image: caddy:${CADDY_VERSION:-2.11.6}
    restart: unless-stopped
    ports:
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    volumes:
      - ../common/Caddyfile:/etc/caddy/Caddyfile:ro
      # https://<SITE_ADDRESS>/docs/ と /client/ で配る資料と設定スクリプト
      - ../../docs:/srv/docs:ro
      - ../common/client:/srv/client:ro
      - caddy-data:/data
    depends_on: [collector, grafana]

  collector:
    image: otel/opentelemetry-collector-contrib:${OTELCOL_VERSION:-0.162.0}
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      OTEL_INGEST_TOKEN: ${OTEL_INGEST_TOKEN:?OTEL_INGEST_TOKEN が未設定です。deploy/setup-env.sh で .env を作ってください}
    volumes:
      - ./collector/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      # 動作確認用（TLS なし）。ホスト自身からだけ受ける。
      - "127.0.0.1:4318:4318"
    mem_limit: 512m
    # push 先が先に起動していること（Collector は送れない間は再送する）
    depends_on: [prometheus, loki]

  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION:-v3.15.0}
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-400d}
      - --web.enable-otlp-receiver
      # 短いセッションはカウンターを 1 回しか送らないので、開始時刻に 0 を入れて increase() が値を返すようにする。
      # ダッシュボードは外挿しない `anchored` を使う（どちらも Prometheus 3.x の実験的機能）。
      - --enable-feature=created-timestamp-zero-ingestion,promql-extended-range-selectors
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 6

  loki:
    image: grafana/loki:${LOKI_VERSION:-3.7.8}
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yaml", "-config.expand-env=true"]
    environment:
      LOKI_RETENTION: ${LOKI_RETENTION:-2160h}
    volumes:
      - ./loki/config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 12

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-13.2.3}
    restart: unless-stopped
    # 起動のたびに admin のパスワードを .env の GRAFANA_ADMIN_PASSWORD に合わせてから Grafana を起動する
    entrypoint: ["/bin/sh", "/usr/local/bin/start-grafana.sh"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD が未設定です。deploy/setup-env.sh で .env を作ってください}
      GF_SERVER_ROOT_URL: https://${SITE_ADDRESS:-localhost}/
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ../common/grafana/start.sh:/usr/local/bin/start-grafana.sh:ro
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana-dashboards:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on: [prometheus, loki]

volumes:
  caddy-data: {}
  prometheus-data: {}
  loki-data: {}
  grafana-data: {}
