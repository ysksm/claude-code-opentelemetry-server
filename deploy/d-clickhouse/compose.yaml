# 案 D：Collector → ClickHouse（metrics・events とも）→ Grafana（ClickHouse プラグイン）
name: claude-otel-clickhouse

services:
  caddy:
    image: caddy:${CADDY_VERSION}
    restart: unless-stopped
    ports:
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    volumes:
      - ../common/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [collector, grafana]

  collector:
    image: otel/opentelemetry-collector-contrib:${OTELCOL_VERSION}
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      OTEL_INGEST_TOKEN: ${OTEL_INGEST_TOKEN}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_TTL: ${CLICKHOUSE_TTL:-17520h}
    volumes:
      - ./collector/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      # 動作確認用（TLS なし）。ホスト自身からだけ受ける。
      - "127.0.0.1:4318:4318"
    mem_limit: 512m
    # clickhouse exporter は起動時に ClickHouse へ接続できないと Collector ごと終了する。
    # ClickHouse の準備完了を待ってから起動する（落ちても restart で再試行される）。
    depends_on:
      clickhouse:
        condition: service_healthy

  clickhouse:
    image: clickhouse/clickhouse-server:${CLICKHOUSE_VERSION}
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user \"$$CLICKHOUSE_USER\" --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION}
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://${SITE_ADDRESS}/
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_SYNC: grafana-clickhouse-datasource@${CLICKHOUSE_PLUGIN_VERSION}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana-dashboards:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on: [clickhouse]

volumes:
  caddy-data: {}
  clickhouse-data: {}
  clickhouse-logs: {}
  grafana-data: {}
